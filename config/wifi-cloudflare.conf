# Account-scoped API Token action. Credentials are never expanded into commands.
[Definition]
actionstart =
actionstop =
actioncheck =
actionban = /usr/bin/python3 /usr/local/libexec/wifi-fail2ban/wifi_cloudflare.py ban --credentials "<credential_file>" --owner "<rule_owner>" --jail "<name>" --ip "<ip>"
actionunban = /usr/bin/python3 /usr/local/libexec/wifi-fail2ban/wifi_cloudflare.py unban --credentials "<credential_file>" --owner "<rule_owner>" --jail "<name>" --ip "<ip>"

[Init]
credential_file = /root/.config/wifi-fail2ban/cloudflare.credentials
rule_owner =
timeout = 60
